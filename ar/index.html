<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orun — Table AR</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #overlay { position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; text-align:center; color:#e8f5ee; padding:18px 24px 22px;
    background: rgba(4,8,6,.86); z-index:10; }
  #overlay h1 { margin:0; font-size: clamp(22px, 4vw, 32px); letter-spacing:2px; color:#39d97e; }
  #overlay p { margin:0; max-width:560px; line-height:1.5; color:#b9cfc2; font-size:clamp(13px,2.2vw,15px); }
  #enterAR { font-size:20px; font-weight:700; letter-spacing:1px; padding:16px 40px; border:2px solid #1fae5c;
    border-radius:999px; background:transparent; color:#39d97e; cursor:pointer; }
  #enterAR:active { transform:scale(.97); }
  #status { font-size:13px; color:#8fa89a; min-height:20px; }
  .hidden { display:none !important; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <h1>ORUN — TABLE AR v19</h1>
  <p>Green table in your room. SETTINGS on the table: position + table color + hand color.</p>
  <button id="enterAR">ENTER AR</button>
  <div id="status"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// NO background — transparent for AR passthrough

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 50);
camera.position.set(0, 1.4, 0.6);

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(1, 3, 1);
scene.add(dir);

const rig = new THREE.Group();
scene.add(rig);
rig.add(camera);

// ============ the table only ============
const TABLE = { r: 0.5, topY: 0.72, z: -0.55 };
const tableGroup = new THREE.Group();
tableGroup.position.z = TABLE.z;
scene.add(tableGroup);

const felt = new THREE.Mesh(
  new THREE.CylinderGeometry(TABLE.r, TABLE.r, 0.05, 48),
  new THREE.MeshStandardMaterial({ color:0x0d3b2e, roughness:0.95 })
);
felt.position.y = TABLE.topY - 0.025;
tableGroup.add(felt);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(TABLE.r, 0.022, 12, 64),
  new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.5, metalness:0.4 })
);
rim.rotation.x = Math.PI/2;
rim.position.y = TABLE.topY;
tableGroup.add(rim);

const trim = new THREE.Mesh(
  new THREE.TorusGeometry(TABLE.r - 0.03, 0.008, 8, 64),
  new THREE.MeshStandardMaterial({ color:0xd4af37, metalness:0.8, roughness:0.3 })
);
trim.rotation.x = Math.PI/2;
trim.position.y = TABLE.topY + 0.001;
tableGroup.add(trim);



// blinking alive light
const blink = new THREE.Mesh(
  new THREE.SphereGeometry(0.02, 12, 8),
  new THREE.MeshBasicMaterial({ color:0x39d97e })
);
blink.position.set(0, TABLE.topY + 0.1, TABLE.z);
scene.add(blink);
let blinkT = 0;

// ============ hand tracking + touch ============
const touchables = [];
function addTouchable(getPos, r, onTouch) {
  touchables.push({ getPos, r, onTouch, inside:new Set() });
}
// Three.js hand objects — the right way, with visible meshes
const handFactory = new XRHandModelFactory();
const xrHands = [renderer.xr.getHand(0), renderer.xr.getHand(1)];
for (const h of xrHands) {
  h.add(handFactory.createHandModel(h, 'mesh'));
  scene.add(h);
}
const _jv = new THREE.Vector3();
function getFingertip(i, out) {
  const hand = xrHands[i];
  if (!hand) return false;
  const j = hand.joints && hand.joints['index-finger-tip'];
  if (!j) return false;
  try { j.getWorldPosition(out); return true; }
  catch(e) { return false; }
}
const _v = new THREE.Vector3();
// visible fingertip dots — green when tracking, so you know hands are live
const fingertipDots = [];
function updateFingertips() {
  for (const d of fingertipDots) scene.remove(d);
  fingertipDots.length = 0;
  for (let i = 0; i < 2; i++) {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.015, 10, 8),
      new THREE.MeshBasicMaterial({ color:0x00ff88 })
    );
    if (!getFingertip(i, dot.position)) continue;
    scene.add(dot);
    fingertipDots.push(dot);
  }
}
function checkTouchables() {
  for (const t of touchables) {
    let pos;
    try { pos = t.getPos(); } catch(e) { continue; }
    for (let i = 0; i < 2; i++) {
      if (!getFingertip(i, _v)) continue;
      const d = _v.distanceTo(pos);
      const isInside = d < t.r;
      const wasInside = t.inside.has(i);
      if (isInside && !wasInside) { t.inside.add(i); try { t.onTouch(); } catch(e) {} }
      else if (!isInside && wasInside) t.inside.delete(i);
    }
  }
}

// ============ table adjustment buttons ============
function makeButton(label, color) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.05, 0.02, 24),
    new THREE.MeshStandardMaterial({ color, roughness:0.4, metalness:0.3 })
  );
  g.add(base);
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.font = 'bold 36px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const lm = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.02),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true }));
  lm.rotation.x = -Math.PI/2; lm.position.y = 0.012;
  g.add(lm);
  return g;
}

// Settings button lives ON the table — moves with it
const settingsBtn = makeButton('SETTINGS', 0xd4af37);
settingsBtn.position.set(0.35, 0.74, 0.25);
tableGroup.add(settingsBtn);

// Settings panel — lies flat ON the table, rides with it
const adjGroup = new THREE.Group();
adjGroup.position.set(-0.05, 0.74, -0.08);
adjGroup.visible = false;
tableGroup.add(adjGroup);

const btnUp = makeButton('UP', 0x1fae5c);
btnUp.position.set(-0.25, 0, 0.12);
const btnDown = makeButton('DOWN', 0x1fae5c);
btnDown.position.set(-0.15, 0, 0.12);
const btnLeft = makeButton('LEFT', 0x1fae5c);
btnLeft.position.set(-0.05, 0, 0.12);
const btnRight = makeButton('RIGHT', 0x1fae5c);
btnRight.position.set(0.05, 0, 0.12);
const btnFwd = makeButton('FWD', 0x1fae5c);
btnFwd.position.set(0.15, 0, 0.12);
const btnBack = makeButton('BACK', 0x1fae5c);
btnBack.position.set(0.25, 0, 0.12);
adjGroup.add(btnUp, btnDown, btnLeft, btnRight, btnFwd, btnBack);

function makeLabel(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 48;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.font = 'bold 28px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 128, 24);
  const tex = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.022),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true }));
  m.rotation.x = -Math.PI/2;
  return m;
}
const tableLabel = makeLabel('TABLE');
tableLabel.position.set(0, 0.001, 0.02);
adjGroup.add(tableLabel);
// Color swatches for the table felt
const TABLE_COLORS = [0x0d3b2e, 0x6f4e37, 0x1a3a5c, 0x5c1a1a, 0x3a1a5c, 0xd4af37, 0x111111];
const tableSwatches = [];
TABLE_COLORS.forEach((col, i) => {
  const s = new THREE.Mesh(
    new THREE.CircleGeometry(0.025, 24),
    new THREE.MeshBasicMaterial({ color:col, side:THREE.DoubleSide })
  );
  s.rotation.x = -Math.PI/2;
  s.position.set(-0.18 + i * 0.06, 0.001, -0.02);
  adjGroup.add(s);
  tableSwatches.push({ mesh:s, color:col });
  addTouchable(() => { const v = new THREE.Vector3(); s.getWorldPosition(v); return v; },
    0.04, () => { felt.material.color.setHex(col); });
});

const handsLabel = makeLabel('HANDS');
handsLabel.position.set(0, 0.001, -0.06);
adjGroup.add(handsLabel);
// Hand color + style
let handColor = 0xffffff;
let handStyle = 'solid'; // solid | ghost | clear
function applyHandStyle() {
  for (const h of xrHands) {
    h.traverse((o) => {
      if (o.isMesh && o.material) {
        o.material.color.setHex(handColor);
        if (handStyle === 'solid') {
          o.material.transparent = false;
          o.material.opacity = 1.0;
        } else if (handStyle === 'ghost') {
          o.material.transparent = true;
          o.material.opacity = 0.35;
        } else { // clear
          o.material.transparent = true;
          o.material.opacity = 0.0;
        }
        o.material.needsUpdate = true;
      }
    });
  }
}
const HAND_COLORS = [0xffffff, 0x6f4e37, 0x39d97e, 0x4488ff, 0xd4af37, 0xff5040];
HAND_COLORS.forEach((col, i) => {
  const s = new THREE.Mesh(
    new THREE.CircleGeometry(0.025, 24),
    new THREE.MeshBasicMaterial({ color:col, side:THREE.DoubleSide })
  );
  s.rotation.x = -Math.PI/2;
  s.position.set(-0.15 + i * 0.06, 0.001, -0.10);
  adjGroup.add(s);
  addTouchable(() => { const v = new THREE.Vector3(); s.getWorldPosition(v); return v; },
    0.04, () => { handColor = col; applyHandStyle(); });
});
// style buttons: SOLID | GHOST | CLEAR
const handStyles = [['SOLID','solid',0x1fae5c], ['GHOST','ghost',0x4488ff], ['CLEAR','clear',0x666666]];
handStyles.forEach(([label, style, btnCol], i) => {
  const b = makeButton(label, btnCol);
  b.position.set(-0.12 + i * 0.12, 0, -0.17);
  b.scale.set(0.8, 0.8, 0.8);
  adjGroup.add(b);
  addTouchable(() => { const v = new THREE.Vector3(); b.getWorldPosition(v); return v; },
    0.06, () => { handStyle = style; applyHandStyle(); });
});
// Glass toggle (the keeper)
const glassLabel = makeLabel('FINISH');
glassLabel.position.set(0, 0.001, -0.23);
adjGroup.add(glassLabel);
const glassBtn = makeButton('GLASS', 0x88ccff);
glassBtn.scale.set(0.7, 0.7, 0.7);
glassBtn.position.set(-0.06, 0, -0.28);
adjGroup.add(glassBtn);
const solidBtn = makeButton('SOLID', 0x888888);
solidBtn.scale.set(0.7, 0.7, 0.7);
solidBtn.position.set(0.06, 0, -0.28);
adjGroup.add(solidBtn);
let isGlass = false;
addTouchable(() => { const v = new THREE.Vector3(); glassBtn.getWorldPosition(v); return v; },
  0.05, () => {
    isGlass = true;
    felt.material.transparent = true;
    felt.material.opacity = 0.5;
    felt.material.roughness = 0.05;
    felt.material.metalness = 0.0;
    felt.material.needsUpdate = true;
  });
addTouchable(() => { const v = new THREE.Vector3(); solidBtn.getWorldPosition(v); return v; },
  0.05, () => {
    isGlass = false;
    felt.material.transparent = false;
    felt.material.opacity = 1.0;
    felt.material.roughness = 1.0;
    felt.material.metalness = 0.0;
    felt.material.needsUpdate = true;
  });

});

let tableY = TABLE.topY, tableZ = TABLE.z, tableX = 0;
const wp = (obj) => { const v = new THREE.Vector3(); obj.getWorldPosition(v); return v; };

addTouchable(() => { const v = new THREE.Vector3(); settingsBtn.getWorldPosition(v); return v; },
  0.08, () => { adjGroup.visible = !adjGroup.visible; });
addTouchable(() => wp(btnUp), 0.07, () => { tableY = Math.min(1.1, tableY + 0.03); tableGroup.position.y = tableY - TABLE.topY; });
addTouchable(() => wp(btnDown), 0.07, () => { tableY = Math.max(0.4, tableY - 0.03); tableGroup.position.y = tableY - TABLE.topY; });
addTouchable(() => wp(btnFwd), 0.07, () => { tableZ = Math.max(-1.0, tableZ - 0.03); tableGroup.position.z = tableZ; });
addTouchable(() => wp(btnBack), 0.07, () => { tableZ = Math.min(-0.2, tableZ + 0.03); tableGroup.position.z = tableZ; });
addTouchable(() => { const v = new THREE.Vector3(); btnLeft.getWorldPosition(v); return v; },
  0.07, () => { tableX = Math.max(-0.5, tableX - 0.03); tableGroup.position.x = tableX; });
addTouchable(() => { const v = new THREE.Vector3(); btnRight.getWorldPosition(v); return v; },
  0.07, () => { tableX = Math.min(0.5, tableX + 0.03); tableGroup.position.x = tableX; });

// ============ enter AR ============
const enterBtn = document.getElementById('enterAR');
const statusEl = document.getElementById('status');

enterBtn.addEventListener('click', async () => {
  if (!navigator.xr) { statusEl.textContent = 'WebXR not available'; return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  if (!ok) { statusEl.textContent = 'AR not supported on this device'; return; }
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor', 'hand-tracking']
    });
    renderer.xr.setSession(session);
    document.getElementById('overlay').classList.add('hidden');
    session.addEventListener('end', () => {
      document.getElementById('overlay').classList.remove('hidden');
    });
  } catch (e) {
    statusEl.textContent = 'Could not start AR: ' + e.message;
  }
});

// ============ animation loop — nothing but render ============
renderer.setAnimationLoop(() => {
  try { checkTouchables(); } catch(e) {}
  try { updateFingertips(); } catch(e) {}
  blinkT += 0.05;
  const hand0 = getFingertip(0, _v), hand1 = getFingertip(1, _v);
  if (hand0 || hand1) {
    blink.material.color.setHex(0x00ff88); // solid green = hands detected
  } else {
    blink.material.color.setHex(Math.sin(blinkT * 3) > 0 ? 0xff3333 : 0x550000); // blinking red = no hands
  }
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
