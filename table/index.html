<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orun — Table Test</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04070a; overflow:hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #overlay { position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; text-align:center; color:#e8f5ee; padding:18px 24px 22px;
    background: rgba(4,8,6,.86); backdrop-filter: blur(8px);
    border-top:1px solid #1d3a2c; z-index:10; }
  #overlay h1 { margin:0; font-size: clamp(22px, 4vw, 32px); letter-spacing:2px; color:#39d97e; }
  #overlay p { margin:0; max-width:560px; line-height:1.5; color:#b9cfc2; font-size:clamp(13px,2.2vw,15px); }
  #enter { font-size:20px; font-weight:700; letter-spacing:1px; padding:16px 40px; border:none;
    border-radius:999px; background:#1fae5c; color:#04120a; cursor:pointer;
    box-shadow:0 0 32px rgba(57,217,126,.45); }
  #enter:active { transform:scale(.97); }
  #enter:disabled { background:#234034; color:#5c7268; box-shadow:none; cursor:default; }
  #status { font-size:13px; color:#8fa89a; min-height:20px; }
  .hidden { display:none !important; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="overlay">
  <h1>ORUN — TABLE TEST v1</h1>
  <p>Just the table. Yellow button toggles position controls.</p>
  <button id="enter">ENTER VR</button>
  <div id="status"></div>
</div>
<script type="module">
import * as THREE from 'three';

// ============ basic setup ============
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070a);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 50);
camera.position.set(0, 1.4, 0.6);

// lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(1, 3, 1);
scene.add(dir);

// rig (moves with table adjustments)
const rig = new THREE.Group();
scene.add(rig);
rig.add(camera);

// ============ the table ============
const TABLE = { r: 0.5, topY: 0.72, z: -0.55 };
const tableGroup = new THREE.Group();
scene.add(tableGroup);

const felt = new THREE.Mesh(
  new THREE.CylinderGeometry(TABLE.r, TABLE.r, 0.05, 48),
  new THREE.MeshStandardMaterial({ color:0x0d3b2e, roughness:0.95 })
);
felt.position.y = TABLE.topY - 0.025;
tableGroup.add(felt);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(TABLE.r, 0.022, 12, 64),
  new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.5, metalness:0.4 })
);
rim.rotation.x = Math.PI/2;
rim.position.y = TABLE.topY;
tableGroup.add(rim);

// gold trim ring
const trim = new THREE.Mesh(
  new THREE.TorusGeometry(TABLE.r - 0.03, 0.008, 8, 64),
  new THREE.MeshStandardMaterial({ color:0xd4af37, metalness:0.8, roughness:0.3 })
);
trim.rotation.x = Math.PI/2;
trim.position.y = TABLE.topY + 0.001;
tableGroup.add(trim);

tableGroup.position.z = TABLE.z;

// ============ touch controls ============
const touchables = [];
function addTouchable(getPos, r, onTouch) {
  touchables.push({ getPos, r, onTouch, inside:new Set() });
}

// hand tracking
const handInputs = [];
function setupHands() {
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const source of session.inputSources) {
    if (source.hand) {
      handInputs.push({ source, tip:null });
    }
  }
  session.addEventListener('inputsourceschange', (e) => {
    for (const s of e.added) if (s.hand) handInputs.push({ source:s, tip:null });
    for (const s of e.removed) {
      const i = handInputs.findIndex(h => h.source === s);
      if (i >= 0) handInputs.splice(i, 1);
    }
  });
}

const _v = new THREE.Vector3();
function checkTouchables() {
  for (const t of touchables) {
    const pos = t.getPos();
    for (const h of handInputs) {
      if (!h.source.hand) continue;
      const joints = h.source.hand;
      const tip = joints.get('index-finger-tip');
      if (!tip) continue;
      tip.getWorldPosition(_v);
      const d = _v.distanceTo(pos);
      const isInside = d < t.r;
      const wasInside = t.inside.has(h);
      if (isInside && !wasInside) {
        t.inside.add(h);
        t.onTouch();
      } else if (!isInside && wasInside) {
        t.inside.delete(h);
      }
    }
  }
}

// ============ table adjustment UI ============
// Yellow TABLE button — toggles the 4 adjustment buttons
const tableBtnGroup = new THREE.Group();
tableBtnGroup.position.set(0.35, TABLE.topY + 0.02, TABLE.z + 0.25);
scene.add(tableBtnGroup);

function makeButton(label, color) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.05, 0.02, 24),
    new THREE.MeshStandardMaterial({ color, roughness:0.4, metalness:0.3 })
  );
  g.add(base);
  // label
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.font = 'bold 36px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(label, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const lm = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.02),
    new THREE.MeshBasicMaterial({ map:tex, transparent:true }));
  lm.rotation.x = -Math.PI/2;
  lm.position.y = 0.012;
  g.add(lm);
  return g;
}

// Main yellow TABLE button
const tableBtn = makeButton('TABLE', 0xd4af37);
tableBtnGroup.add(tableBtn);

// Adjustment buttons (hidden until TABLE is pressed)
const adjGroup = new THREE.Group();
adjGroup.visible = false;
scene.add(adjGroup);

const btnUp = makeButton('UP', 0x1fae5c);
btnUp.position.set(-0.15, TABLE.topY + 0.02, TABLE.z + 0.25);
const btnDown = makeButton('DOWN', 0x1fae5c);
btnDown.position.set(-0.05, TABLE.topY + 0.02, TABLE.z + 0.25);
const btnFwd = makeButton('FWD', 0x1fae5c);
btnFwd.position.set(0.05, TABLE.topY + 0.02, TABLE.z + 0.25);
const btnBack = makeButton('BACK', 0x1fae5c);
btnBack.position.set(0.15, TABLE.topY + 0.02, TABLE.z + 0.25);
adjGroup.add(btnUp, btnDown, btnFwd, btnBack);

let tableY = TABLE.topY;
let tableZ = TABLE.z;

addTouchable(() => { const v = new THREE.Vector3(); tableBtn.getWorldPosition(v); return v; }, 0.07,
  () => { adjGroup.visible = !adjGroup.visible; });

addTouchable(() => { const v = new THREE.Vector3(); btnUp.getWorldPosition(v); return v; }, 0.07,
  () => { tableY = Math.min(1.1, tableY + 0.03); tableGroup.position.y = tableY - TABLE.topY; });

addTouchable(() => { const v = new THREE.Vector3(); btnDown.getWorldPosition(v); return v; }, 0.07,
  () => { tableY = Math.max(0.4, tableY - 0.03); tableGroup.position.y = tableY - TABLE.topY; });

addTouchable(() => { const v = new THREE.Vector3(); btnFwd.getWorldPosition(v); return v; }, 0.07,
  () => { tableZ = Math.max(-1.0, tableZ - 0.03); tableGroup.position.z = tableZ; });

addTouchable(() => { const v = new THREE.Vector3(); btnBack.getWorldPosition(v); return v; }, 0.07,
  () => { tableZ = Math.min(-0.2, tableZ + 0.03); tableGroup.position.z = tableZ; });

// ============ enter VR ============
const enterBtn = document.getElementById('enter');
const statusEl = document.getElementById('status');

enterBtn.addEventListener('click', async () => {
  if (!navigator.xr) { statusEl.textContent = 'WebXR not available'; return; }
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hand-tracking']
    });
    renderer.xr.setSession(session);
    setupHands();
    document.getElementById('overlay').classList.add('hidden');
    session.addEventListener('end', () => {
      document.getElementById('overlay').classList.remove('hidden');
    });
  } catch (e) {
    statusEl.textContent = 'Could not start VR: ' + e.message;
  }
});

// ============ animation loop ============
renderer.setAnimationLoop(() => {
  checkTouchables();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
